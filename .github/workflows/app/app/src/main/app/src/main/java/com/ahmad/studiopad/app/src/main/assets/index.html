<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahmad Studio Pad - Unicode & Style Designer</title>
  <style>
    /* Night Studio Theme: Obsidian Background with Neon Lime Accents */
    :root {
      --bg-dark: #0f1117;
      --card-bg: #181b22;
      --accent-lime: #d4ff00;
      --accent-coral: #ff5c5c;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #2e3440;
    }
    body { margin: 0; background: var(--bg-dark); color: var(--text-main); font-family: 'Manrope', sans-serif; }
    
    /* 1. Top Header */
    .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #161922; border-bottom: 1px solid var(--border-color); }
    .creator-links a { color: var(--accent-lime); margin-left: 12px; text-decoration: none; font-weight: 600; font-size: 13px; }
    
    /* 2. Interactive Canvas */
    .canvas-container { padding: 16px; position: relative; }
    #nameCanvas {
      width: 100%; height: 130px; background: #fff; color: #111;
      border-radius: 12px; border: 2px solid var(--border-color);
      padding: 14px; font-size: 18px; outline: none; box-sizing: border-box;
      resize: none;
    }
    .canvas-actions { position: absolute; right: 28px; bottom: 28px; display: flex; gap: 8px; }
    .btn-action { background: #000000bb; color: #fff; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; }

    /* 3. Pro Toolbar (2 Rows) */
    .toolbar-row { display: flex; overflow-x: auto; gap: 6px; padding: 6px 16px; background: #1a1e27; }
    .tool-btn { background: #262c38; border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; padding: 8px 12px; font-size: 14px; cursor: pointer; white-space: nowrap; }
    .tool-btn:active { background: var(--accent-lime); color: #000; }

    /* 4. Category Tabs Ribbon */
    .tabs-ribbon { display: flex; overflow-x: auto; gap: 8px; padding: 10px 16px; background: #12151c; border-bottom: 1px solid var(--border-color); }
    .tab-item { padding: 8px 16px; border-radius: 20px; background: #212631; color: var(--text-muted); border: none; cursor: pointer; font-weight: bold; white-space: nowrap; }
    .tab-item.active { background: var(--accent-lime); color: #0f1117; }

    /* 5. Glyph Grid Panel */
    .glyph-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 8px; padding: 16px; max-height: 380px; overflow-y: auto; }
    .glyph-cell { height: 46px; display: flex; align-items: center; justify-content: center; background: #1c212c; border: 1px solid var(--border-color); border-radius: 10px; font-size: 18px; cursor: pointer; }
    .glyph-cell:active { transform: scale(0.92); border-color: var(--accent-lime); }

    /* Styles & Intro/Outro Cards */
    .style-card { display: flex; justify-content: space-between; align-items: center; background: #1c212c; border: 1px solid var(--border-color); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Top Header with Social Links -->
  <header class="header">
    <div style="font-weight: 800; font-size: 17px; color: var(--accent-lime);">Ahmad Studio Pad</div>
    <div class="creator-links">
      <a href="https://youtube.com" target="_blank">YouTube</a>
      <a href="https://tiktok.com" target="_blank">TikTok</a>
      <a href="https://telegram.org" target="_blank">Telegram</a>
    </div>
  </header>

  <!-- Interactive Canvas -->
  <div class="canvas-container">
    <textarea id="nameCanvas" placeholder="Enter your text or name here..."></textarea>
    <div class="canvas-actions">
      <button class="btn-action" onclick="copyText()">📋 Copy</button>
      <button class="btn-action" onclick="clearText()">✕ Clear</button>
    </div>
  </div>

  <!-- 2-Row Action Toolbar -->
  <div class="toolbar-row">
    <button class="tool-btn" onclick="execUndo()">↶ Undo</button>
    <button class="tool-btn" onclick="execRedo()">↷ Redo</button>
    <button class="tool-btn" onclick="moveCursorStart()">|◀ Start</button>
    <button class="tool-btn" onclick="moveCursorEnd()">▶| End</button>
    <button class="tool-btn" onclick="changeFontSize(14)">14px</button>
    <button class="tool-btn" onclick="changeFontSize(18)">18px</button>
    <button class="tool-btn" onclick="changeFontSize(24)">24px</button>
  </div>
  <div class="toolbar-row">
    <button class="tool-btn" onclick="cursorLeft()">◀ Left</button>
    <button class="tool-btn" onclick="cursorRight()">▶ Right</button>
    <button class="tool-btn" onclick="backspace()">⌫ Del</button>
    <button class="tool-btn" onclick="insertSymbol(' ')">␣ Space</button>
    <button class="tool-btn" onclick="insertSymbol('\n')">↵ Enter</button>
  </div>

  <!-- Tabs Navigation (Aap ke Screenshots wale Tabs) -->
  <div class="tabs-ribbon">
    <button class="tab-item active" onclick="switchTab('ALPHABET')">ALPHABET</button>
    <button class="tab-item" onclick="switchTab('STYLES')">STYLES</button>
    <button class="tab-item" onclick="switchTab('INTRO')">INTRO</button>
    <button class="tab-item" onclick="switchTab('OUTRO')">OUTRO</button>
    <button class="tab-item" onclick="switchTab('URDU')">URDU</button>
    <button class="tab-item" onclick="switchTab('BLANK')">BLANK</button>
    <button class="tab-item" onclick="switchTab('COMBINING')">COMBINING</button>
    <button class="tab-item" onclick="switchTab('DECORATIONS')">DECORATIONS</button>
  </div>

  <!-- Dynamic Content Area -->
  <div id="tabContent" class="glyph-grid"></div>

  <!-- Core JavaScript Engine -->
  <script>
    const canvas = document.getElementById('nameCanvas');
    let history = [];
    let historyIndex = -1;

    // Save history for Undo/Redo
    function recordState() {
      history = history.slice(0, historyIndex + 1);
      history.push(canvas.value);
      historyIndex++;
    }

    // Insert glyph at current cursor position
    function insertSymbol(str) {
      const start = canvas.selectionStart;
      const end = canvas.selectionEnd;
      canvas.value = canvas.value.substring(0, start) + str + canvas.value.substring(end);
      canvas.selectionStart = canvas.selectionEnd = start + str.length;
      canvas.focus();
      recordState();
    }

    // Copy to clipboard
    function copyText() {
      if (!canvas.value) return;
      navigator.clipboard.writeText(canvas.value);
      alert('Copied to clipboard!');
    }

    function clearText() {
      canvas.value = '';
      recordState();
    }

    function changeFontSize(size) {
      canvas.style.fontSize = size + 'px';
    }

    function cursorLeft() {
      if (canvas.selectionStart > 0) {
        canvas.selectionStart = canvas.selectionEnd = canvas.selectionStart - 1;
        canvas.focus();
      }
    }

    function cursorRight() {
      if (canvas.selectionEnd < canvas.value.length) {
        canvas.selectionStart = canvas.selectionEnd = canvas.selectionEnd + 1;
        canvas.focus();
      }
    }

    function backspace() {
      const start = canvas.selectionStart;
      const end = canvas.selectionEnd;
      if (start === end && start > 0) {
        canvas.value = canvas.value.substring(0, start - 1) + canvas.value.substring(end);
        canvas.selectionStart = canvas.selectionEnd = start - 1;
      } else if (start !== end) {
        canvas.value = canvas.value.substring(0, start) + canvas.value.substring(end);
        canvas.selectionStart = canvas.selectionEnd = start;
      }
      canvas.focus();
      recordState();
    }

    // Data Packs for Tabs
    const DATA = {
      ALPHABET: ["A", "𝔸", "𝕬", "Ꭺ", "Ꭿ", "⍲", "ꪁ", "ɑ", "ꪋ", "ꪖ", "𝚨", "𝚲", "𝝙", "B", "𝔹", "𝕭", "ℬ", "Ᏼ", "в", "ᖯ", "ᨢ", "ϐ", "Ꮂ", "Ᏸ", "𝚩", "𝛃", "C", "ℂ", "𝕮", "Ꮳ", "Ꮯ", "Ƈ", "ℭ", "ɕ", "᥌"],
      INTRO: ["•- ❍Ꮿ͢", "𝆺꯭𝅥", "_ ⋋ v", "_ x 💖", "✦•····", "𓈒𓏸｡˚ ୨ৎ ", "꒰ა ", "˚ ༘♡ "],
      OUTRO: ["​᭄𓆪", "Ξ⤹³", " ୨ৎ ˚｡𓏸𓈒", " ໒꒱", "♡ ༘˚", " 𓆩♡𓆪", " ༺♡༻", " 𐙚"],
      URDU: ["•┈┈┈๑⋅⋯ ୨ ୧ ⋯⋅๑┈┈┈•", "╭──────────˙ . ꒷ 🍰 . 𖦹˙─╮", "╰─˙ . ꒷ 🍰 . 𖦹˙──────────╯", "𝆺꯭𝅥🇦Ᏸ𝆭Ᏸ𝆭ɑ֟͜𝛅༏ Ꮿ͢σ‌֟꧊ꝛ͢ɭժׁׅΞ⤹³", "•- ❍Ꮿ͢η̽ɛɼ֟፝ ​᭄𓆪"],
      BLANK: ["\u200B", "\u200C", "\u200D", "\uFEFF", "\uFFA0", "\u2060"],
      COMBINING: ["\u0336", "\u0337", "\u0338", "\u0305", "\u0332", "\u0308", "\u030A"],
      DECORATIONS: ["𓀀", "𓀁", "𓀂", "𓁸", "𓁹", "𓂀", "𓆩", "𓆪", "𓈀", "𓈃", "🂠", "🂡", "🂢", "౨ৎ", "ʚ ɞ", "ପଓ", "୨ৎ", "♡̶", "ᥫ᭡", "♥︎"]
    };

    function switchTab(tabKey) {
      document.querySelectorAll('.tab-item').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');

      const container = document.getElementById('tabContent');
      container.innerHTML = '';

      if (tabKey === 'STYLES') {
        container.className = '';
        const name = canvas.value || 'Your Name';
        const templates = [
          `る! 🌷 . 𝗡a𝗺e 𓏲 𖧶 𓈒 .`,
          `𝄒 𖥻 ִ ۫ ּ 🥛⭑ N̶a𝗺e 𖣯 ࣪ ٬٬ . ⩇⩇`,
          `ᨦ𓏲 ، ݃♟❜ ℕa𝗺e ᘏ ࣪ ٬٬ . ݁ ۰ ࣪`,
          `ִֶָ ⩇⩇ ꜥ 💭 ◖ 𝗻a𝗺e 𖥔 ࣪˖ 💒 ᐢ..ᐢ`,
          `‎¨🐰╳𓊆name𓊇╳🥛˒˒`
        ];
        templates.forEach(tpl => {
          const formatted = tpl.replace(/name|Name|Na𝗺e|𝗻a𝗺e/gi, name);
          const card = document.createElement('div');
          card.className = 'style-card';
          card.innerHTML = `<span>${formatted}</span> <button class="btn-action" style="position:static;">+ Insert</button>`;
          card.onclick = () => insertSymbol(formatted);
          container.appendChild(card);
        });
      } else {
        container.className = 'glyph-grid';
        const list = DATA[tabKey] || [];
        list.forEach(item => {
          const cell = document.createElement('div');
          cell.className = 'glyph-cell';
          cell.innerText = item === '\u200B' ? '[Zero Width]' : item;
          cell.onclick = () => insertSymbol(item);
          container.appendChild(cell);
        });
      }
    }

    // Default load
    switchTab('ALPHABET');
    recordState();
  </script>
</body>
</html>
