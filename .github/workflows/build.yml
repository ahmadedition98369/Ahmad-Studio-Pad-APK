name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Organize Files & Build APK
        run: |
          # 1. Create proper folder structure
          mkdir -p app/src/main/java/com/ahmad/studiopad
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          # 2. Auto-move files to right place
          find . -name "settings.gradle" -not -path "./settings.gradle" -exec cp {} ./settings.gradle \;
          find . -name "build.gradle" | grep -v "/app/" | grep -v "^\./build\.gradle" | head -n 1 | xargs -I {} cp {} ./build.gradle || true
          find . -path "*/app/build.gradle" -not -path "./app/build.gradle" -exec cp {} ./app/build.gradle \; || true
          find . -name "AndroidManifest.xml" -not -path "./app/src/main/AndroidManifest.xml" -exec cp {} ./app/src/main/AndroidManifest.xml \;
          find . -name "MainActivity.java" -not -path "./app/src/main/java/com/ahmad/studiopad/MainActivity.java" -exec cp {} ./app/src/main/java/com/ahmad/studiopad/MainActivity.java \;
          find . -name "index.html" -not -path "./app/src/main/assets/index.html" -exec cp {} ./app/src/main/assets/index.html \;

          # 3. Create required Android strings
          echo '<resources><string name="app_name">Ahmad Studio Pad</string></resources>' > app/src/main/res/values/strings.xml

          # 4. Build APK
          gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ahmad-Studio-Pad-APK
          path: app/build/outputs/apk/debug/app-debug.apk
